name: Profile Cards Update

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate profile cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/

          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi

          git commit -m "chore: update profile cards [skip ci]"

          # A push is the most failure-prone step here: upstream incidents have
          # returned "fatal error in commit_refs" while the job otherwise looked
          # healthy. Retry with rebase instead of failing the whole run.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; rebasing and retrying in $((i * 5))s"
            sleep $((i * 5))
            git pull --rebase --autostash origin main || true
          done

          echo "push failed after 5 attempts"
          exit 1
